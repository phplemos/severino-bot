name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: severino
          POSTGRES_PASSWORD: severino
          POSTGRES_DB: severino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U severino -d severino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://severino:severino@localhost:5432/severino_test?schema=public
      TEST_DATABASE_URL: postgresql://severino:severino@localhost:5432/severino_test?schema=public
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrações num banco vazio
        run: npx prisma migrate deploy
      - name: Migrações batem com o schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://severino:severino@localhost:5432/postgres" --exit-code
      - run: npm run typecheck
      - run: npm test
      - name: Vulnerabilidades conhecidas
        run: npm audit --audit-level=high
